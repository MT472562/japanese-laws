<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="日本の現行法令を名前・番号・法令IDから検索">
  <title>日本法令検索</title>
  <style>
    :root{--ink:#17212b;--muted:#66717d;--line:#d9dee3;--paper:#f6f5f1;--white:#fff;--red:#9b2c36;--soft:#f8ecec}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}button,input,select{font:inherit}header,.search,.workspace{max-width:1180px;margin:auto}header{padding:48px 28px 24px}.eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:.15em}header h1{margin:8px 0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,6vw,62px);font-weight:600;letter-spacing:-.04em}header p{margin:0;color:var(--muted)}.search{position:sticky;top:0;z-index:5;padding:16px 28px;background:rgba(246,245,241,.94);backdrop-filter:blur(12px)}label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.search-row{display:grid;grid-template-columns:1fr 180px;gap:10px}input,select{height:52px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}input{padding:0 16px}select{padding:0 12px}input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--soft)}.meta{display:flex;justify-content:space-between;padding-top:9px;color:var(--muted);font-size:12px}.meta strong{color:var(--ink)}.workspace{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(0,1.5fr);min-height:620px;padding:0 28px 60px}.results,.viewer{overflow:auto;max-height:72vh;border:1px solid var(--line);background:#fff}.results{border-radius:10px 0 0 10px}.viewer{border-left:0;border-radius:0 10px 10px 0}.law{width:100%;display:grid;grid-template-columns:52px 1fr 16px;gap:12px;align-items:center;padding:16px;border:0;border-bottom:1px solid #eceff1;background:none;color:inherit;text-align:left;cursor:pointer}.law:hover,.law.active{background:var(--soft)}.badge{display:grid;place-items:center;min-height:28px;border:1px solid #e5bfc2;border-radius:4px;color:var(--red);font-size:11px;font-weight:700}.law-info{min-width:0}.law-info b{display:block;overflow:hidden;font-size:14px;line-height:1.5;text-overflow:ellipsis}.law-info small{display:block;overflow:hidden;margin-top:4px;color:var(--muted);font:10px ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}.arrow{color:var(--muted);font-size:22px}.notice{padding:28px;color:var(--muted);font-size:13px;text-align:center}.viewer-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95)}.viewer-bar button{display:none;border:0;background:none;color:var(--red)}.viewer-bar a{margin-left:auto;color:var(--red);font-size:12px;text-decoration:none}.body{max-width:760px;margin:auto;padding:34px 44px 80px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.body h1{margin:0 0 32px;font-size:30px;line-height:1.5}.body h2{margin:42px 0 18px;padding-bottom:10px;border-bottom:1px solid;font-size:21px}.body h3{margin:30px 0 12px;color:var(--red);font-size:17px}.body p{margin:5px 0;line-height:2}.body blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--red);background:var(--paper);line-height:1.9}.blank{height:10px}.placeholder{display:grid;place-items:center;align-content:center;height:100%;padding:40px;color:var(--muted);text-align:center}.placeholder i{display:grid;place-items:center;width:72px;height:72px;border:1px solid var(--line);border-radius:50%;color:var(--red);font:30px serif}.placeholder h2{margin:20px 0 3px;color:var(--ink);font-size:18px}.placeholder p{font-size:13px}footer{padding:24px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}@media(max-width:760px){header{padding:32px 18px 14px}.search{padding:14px 18px}.search-row{grid-template-columns:1fr}.search-row select{height:44px}.workspace{display:block;padding:0 18px 40px}.results{max-height:none;border-radius:10px}.viewer{display:none;position:fixed;inset:0;z-index:20;max-height:none;border:0;border-radius:0}.viewer.open{display:block}.viewer-bar button{display:block}.body{padding:28px 20px 80px}.body h1{font-size:24px}.meta span{max-width:70%}}
  </style>
</head>
<body>
  <header><div class="eyebrow">e-Gov 法令データ / Git mirror</div><h1>日本法令検索</h1><p>現行法令を、名前・番号・法令IDからすばやく探せます。</p></header>
  <section class="search" aria-label="法令検索"><label for="q">検索語</label><div class="search-row"><input id="q" type="search" placeholder="例：道路交通法、個人情報、昭和三十五年" autocomplete="off"><select id="type" aria-label="法令種別"><option value="all">すべての種別</option></select></div><div class="meta"><span id="status">法令一覧を読み込んでいます…</span><strong id="count">0件表示</strong></div></section>
  <main class="workspace"><section id="results" class="results" aria-label="検索結果"></section><article id="viewer" class="viewer"><div id="placeholder" class="placeholder"><i>法</i><h2>法令を選択してください</h2><p>検索結果から法令を選ぶと、ここに本文を表示します。</p></div></article></main>
  <footer>データ出典：e-Gov法令検索　※ 正確な内容は必ずe-Govの原文をご確認ください。</footer>
  <script>
    const TYPES={Constitution:"憲法",Act:"法律",CabinetOrder:"政令",ImperialOrder:"勅令",MinisterialOrdinance:"府省令",Rule:"規則",Misc:"その他"};
    const pathParts=location.pathname.split("/").filter(Boolean);const inferred=location.hostname.endsWith(".github.io")?`${location.hostname.split(".")[0]}/${pathParts[0]||"japanese-laws"}`:"MT472562/japanese-laws";const repo=new URLSearchParams(location.search).get("repo")||inferred;const validRepo=/^[\w.-]+\/[\w.-]+$/.test(repo)?repo:"MT472562/japanese-laws";
    let laws=[],selected=null;const q=document.querySelector("#q"),type=document.querySelector("#type"),results=document.querySelector("#results"),viewer=document.querySelector("#viewer"),status=document.querySelector("#status"),count=document.querySelector("#count");
    Object.entries(TYPES).forEach(([value,label])=>type.add(new Option(label,value)));
    const norm=s=>String(s||"").normalize("NFKC").toLocaleLowerCase("ja").replace(/\s+/g,"");
    function filter(){const words=norm(q.value).split(/[,、]/).filter(Boolean);const shown=laws.filter(l=>(type.value==="all"||l.law_type===type.value)&&words.every(w=>norm(`${l.title} ${l.law_num} ${l.id} ${TYPES[l.law_type]||l.law_type}`).includes(w)));count.textContent=`${shown.length.toLocaleString("ja-JP")}件表示`;results.replaceChildren(...shown.slice(0,200).map(row));if(shown.length>200)results.append(note("先頭200件を表示しています。検索語を追加して絞り込んでください。"));if(laws.length&&shown.length===0)results.append(note("該当する法令がありません。"));}
    function note(text){const p=document.createElement("p");p.className="notice";p.textContent=text;return p}
    function row(law){const b=document.createElement("button");b.className="law"+(selected?.id===law.id?" active":"");const badge=document.createElement("span");badge.className="badge";badge.textContent=TYPES[law.law_type]||law.law_type;const info=document.createElement("span");info.className="law-info";const title=document.createElement("b");title.textContent=law.title;const small=document.createElement("small");small.textContent=`${law.law_num} · ${law.id}`;info.append(title,small);const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="›";b.append(badge,info,arrow);b.onclick=()=>openLaw(law);return b}
    function markdown(source){const fragment=document.createDocumentFragment();source.replace(/^---\n[\s\S]*?\n---\n?/,"").split("\n").forEach(line=>{let el;if(line.startsWith("### ")){el=document.createElement("h3");line=line.slice(4)}else if(line.startsWith("## ")){el=document.createElement("h2");line=line.slice(3)}else if(line.startsWith("# ")){el=document.createElement("h1");line=line.slice(2)}else if(line.startsWith("> ")){el=document.createElement("blockquote");line=line.slice(2)}else if(!line.trim()){el=document.createElement("div");el.className="blank"}else el=document.createElement("p");el.textContent=line.replaceAll("**","");fragment.append(el)});return fragment}
    async function openLaw(law){selected=law;filter();viewer.classList.add("open");viewer.replaceChildren();const bar=document.createElement("div");bar.className="viewer-bar";const back=document.createElement("button");back.textContent="← 一覧へ";back.onclick=()=>viewer.classList.remove("open");const link=document.createElement("a");link.href=`https://github.com/${validRepo}/blob/main/laws/${law.law_type}/${law.id}.md`;link.target="_blank";link.rel="noreferrer";link.textContent="GitHubで表示 ↗";bar.append(back,link);const body=document.createElement("div");body.className="body";body.textContent="本文を読み込んでいます…";viewer.append(bar,body);try{const r=await fetch(`https://raw.githubusercontent.com/${validRepo}/main/laws/${law.law_type}/${law.id}.md`);if(!r.ok)throw Error(r.status);body.replaceChildren(markdown(await r.text()))}catch{body.textContent="本文を読み込めませんでした。GitHub上のファイルを確認してください。"}}
    q.oninput=filter;type.onchange=filter;
    fetch(`https://raw.githubusercontent.com/${validRepo}/main/manifest.json`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(m=>{laws=Object.entries(m.laws||{}).map(([id,v])=>({id,...v})).sort((a,b)=>a.title.localeCompare(b.title,"ja"));status.textContent=`${laws.length.toLocaleString("ja-JP")}件の現行法令`;filter()}).catch(()=>{status.textContent="一覧を読み込めません。リポジトリが公開済みか確認してください。"});
  </script>
</body>
</html>
